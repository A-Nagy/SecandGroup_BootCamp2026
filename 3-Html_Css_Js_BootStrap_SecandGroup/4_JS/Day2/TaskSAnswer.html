<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outputs{
            padding: 20px;
            margin: 20px;
            background-color: aquamarine;
            color: brown;
            font-size: larger;
            font-weight: bold;
            border-radius: 15px ;
        }
    </style>
</head>
<body>
    <div>
        <h1> Task 1</h1>

    <label for="ageinput">Age : </label>
    <input type="number" id="ageinput">
    <button onclick="ShowAge()">Show Age </button>
    <script>
        function ShowAge()
        {
            let enterdage = document.getElementById("ageinput").value ; 
            if(enterdage.trim()==="")
            {
                document.getElementById("result").innerText= "Pls Enter The Age ";
            }else{
               document.getElementById("result").innerText = "The Age Is : " +enterdage +" Years Old" ;
            }
        }
    </script>
    </div>
    <div>
        <h1> Task 2</h1>
    <label for="age">Age : </label>
    <input type="number" id="age">   <br><br>
     <label for="name">Name : </label>
    <input type="text" id="name">     <br><br>
    <label for="email">Email : </label>
    <input type="email" id="email">
    <button onclick="ShowData()">Show Data </button>
    <script>
        function ShowData()
        {  
            let name = document.getElementById("age").value ; 
            let age = document.getElementById("name").value ; 
            let email = document.getElementById("email").value ; 
            if(!name || !age || !email)
            {
                document.getElementById("result").innerText= "Pls Enter All Data ";
            }else{
               document.getElementById("result").innerText = ` Name is : ${name}\nAge is : ${age}\nEmail is : ${email}`;
            }
        }
    </script>
    </div>

    <div>
        <h1>Task 3</h1>
        <button onclick="Greeting()">Greet</button>
        <script>
            function Greeting() 
            {
                const hours = new Date().getHours();
                let gmsg = "";
                if(hours < 12 )
                {
                    gmsg="Good Morning" ; 
                }
                else if(hours < 18 )
                {
                    gmsg="Good Afternoon" ; 
                }
                else{
                    gmsg="Good Evening" ; 

                }
                document.getElementById("result").innerText=gmsg;
            }
        </script>
    </div>
     <div>
        <h1>Task 4</h1>
        <label for="username">User Name  :</label>
        <input type="text" id="username">
        <button onclick="GreetingMe()">Greet ME</button>
        <script>
            function GreetingMe() 
            {
                const username=document.getElementById("username").value ; 
                const hours = new Date().getHours();
                let gmsg = "";
                if(hours < 12 )
                {
                    gmsg="Good Morning , " ; 
                }
                else if(hours < 18 )
                {
                    gmsg="Good Afternoon , " ; 
                }
                else{
                    gmsg="Good Evening , " ; 

                }
                document.getElementById("result").innerText=gmsg+username;
            }
        </script>
    </div>
    <div id="result" class="outputs"></div>
</body>
</html>
