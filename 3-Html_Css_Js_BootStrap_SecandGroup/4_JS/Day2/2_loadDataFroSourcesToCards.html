<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Data In Cards</title>
    <style>
        .card{
            border: 1px solid #CCC;
            padding: 15px;
            margin: 10px;
            background-color: antiquewhite;
            border-radius: 10px;
        }
    </style>
<body>
     <div>
        <h1>From Array (Static Data)</h1>
        <div id="container">
        </div>
        <script>
 const data = [
      { name: "Ali" , job: "Developer", city: "Riyadh" },
      { name: "Sara", job: "Designer", city: "Jeddah" },
      { name: "Omar", job: "Manager", city: "Dammam" },
      { name: "Lina", job: "Engineer", city: "Makkah" }
    ];
          
        const container = document.getElementById("container");
        data.forEach(person=>{
            const card = document.createElement("div");
            card.className = "card" ; 
            card.innerHTML=
            `
            <h2>${person.name}</h3>
            <p> <strong>Job :</strong> ${person.job}</p>
            <p>ِ<b> Address  :</b> ${person.city}</p>  ` ;
           container.appendChild(card);
        });
        </script>
    </div>

    <div>
        <h1>From Api</h1>
        <button onclick="LoadData()">Load Data</button>
       <div id="usersSection"></div>
        <script>
           async function LoadData()
            {
                const responce = await  fetch("https://jsonplaceholder.typicode.com/users");
                const users    = await  responce.json();
              
                const suersection = document.getElementById('usersSection');
                users.forEach(user=>{
                const card = document.createElement("div");
                card.className="card";
                card.innerHTML= `
                      <h2>${user.name}</h3>
                      <p> <strong>User Name :</strong> ${user.username}</p>
                      <p>ِ<b> Address  :</b> ${user.address.city}</p>  ` ;
          suersection.appendChild(card);
                    });    

                
            }
            
        </script>
    </div>
    
</body>
</html>
