<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic nav</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container mt-3">
        <!--Nav Head - pills , tabs-->
        <ul class="nav nav-tabs" role="tablist">
            <li class="nav-item"><a  class="nav-link activ" data-bs-toggle="tab" href="#home" href="#">Home</a></li>
            <li class="nav-item"><a  class="nav-link" data-bs-toggle="tab" href="#about">About us</a></li>
            <li class="nav-item"><a  class="nav-link" data-bs-toggle="tab" href="#call">Call us</a></li>
        </ul>
        <!--Tab Panes-->
    <div class="tab-content">
        <div id="home" class="container tab-pane fade">
            <h1>Home</h1>
        </div>
        <div id="about" class="container tab-pane fade">
            <h1>About US</h1>
        </div>
        <div id="call" class="container tab-pane fade">
            <h1>Call Us </h1>
        </div>

    </div>
      

    </div>
    
</body>
</html>
