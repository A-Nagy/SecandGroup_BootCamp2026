<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Forms</title>
</head>
<body>
    <div class="container my-3">
        <div class="container mt-3">
            <h2>Stacked Form</h2>
            <form action="">
                <div class="m-3">
                    <label for="email" >Email : </label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter Your Email">
                </div>
                <div class="m-3">
                    <label for="password" >Password : </label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter Your Password">
                </div>
                <div class="m-3">
                    <label for="message" >Message : </label>
                    <textarea  class="form-control" id="message" name="message" placeholder="Enter Your message" rows="5"></textarea>
                </div>
                <div class="form-check m-3">
                    <label for="remeber" class="form-check-label">Remember Me </label>
                    <input type="checkbox" class="form-check-input" id="remeber" name="remeber" >
                </div>
                  <div class="form-check m-3">
                    <label for="remeber" class="form-check-label">Remember Me </label>
                    <input type="radio" class="form-check-input" id="remeber" name="remeber" >
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>

        <div class="container mt-3">
            <form class="was-validated">
            <div class="mb-3 mt-3">
      <label for="uname" class="form-label">Username:</label>
      <input type="text" class="form-control" id="uname" placeholder="Enter username" name="uname" required>
      <div class="valid-feedback">Valid.</div>
      <div class="invalid-feedback">Please fill out this field.</div>
    </div>
    <div class="mb-3">
      <label for="pwd" class="form-label">Password:</label>
      <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd" required>
      <div class="valid-feedback">Valid.</div>
      <div class="invalid-feedback">Please fill out this field.</div>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="myCheck"  name="remember" required>
      <label class="form-check-label" for="myCheck">I agree on blabla.</label>
      <div class="valid-feedback">Valid.</div>
      <div class="invalid-feedback">Check this checkbox to continue.</div>
    </div>
  <button type="submit" class="btn btn-primary">Submit</button>
  </form>
                
                </div>
            </form>

        </Div>
        <div class="container mt-3"></Div>




    </div>
    
</body>
</html>
