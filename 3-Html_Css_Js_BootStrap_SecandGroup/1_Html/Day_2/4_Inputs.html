<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inputs</title>
</head>
<body>
    <header>
        <h1>Inputs</h1>
    </header>
    <main>
        <section>
            <form >
                <br>
                <label for="name">Name: </label>
                <input type="text" name="name" id="name" required minlength="3" value="Enter User Name">
                <br>
                <br>
                <label for="email">Email: </label>
                <input type="email" name="email" id="emil" required placeholder="Email@example.com">
                <br>
                <br>
                <label for="password">Password: </label>
                <input type="password" name="password" id="password" minlength="4" required>
                <br>
                <br>
                <label for="bd">Birthdate: </label>
                <input type="date" name="bd" id="bd">
                <br>
                <br>
                <label for="range">Ragne: </label>
                <input type="range" name="range" id="range" min="0" max="100">
                <br>
                <br>
                <label for="count">Count: </label>
                <input type="number" name="count" id="count" max="100" min="0">
                <br>
                <br>
                <label for="color">Color: </label>
                <input type="color" name="color" id="color">
                <br>
                <br>
                <label for="phone">Phone: </label>
                <input type="tel" name="phone" id="phone" pattern="[0-9]{11}" title="من فضلك ادخل رقم الهاتف المكون من 11 رقم ">
                <br>
                <br>
                <label for="file">File Upload: </label>
                <input type="file" name="file" id="file">
                <br><br>
                <input type="radio" name="gender" id="male" value="male" checked>
                <label for="male">Male</label>
                <input type="radio" name="gender" id="female" value="reading">
                <label for="female">Female</label>
                <br><br>
                <input type="checkbox" name="ho" id="reading" value="reading" >
                <label for="reading">Reading</label>
                <input type="checkbox" name="ho" id="sports" value="sports">
                <label for="sports">sports</label>
                <input type="checkbox" name="ho" id="code" value="code" >
                <label for="code">code</label>
                <input type="checkbox" name="ho" id="fixing" value="fixing">
                <label for="fixing">fixing</label>
                <br><br>
                <label for="country1">Choose Countery</label>
                <select name="country1" id="country1">
                    <option value="0">اختار بلدك</option>
                    <option value="Egypt">مصر     </option>
                    <option value="KSA"  >السعودية</option>
                    <option value="UAE"  >الامارات  </option>
                </select>
                <br><br>
                <label for="country">Choose Countery</label>
                <input list="country">
                <datalist id="country">
                    <option value="Egypt">مصر     </option>
                    <option value="KSA"  >السعودية</option>
                    <option value="UAE"  >الامارات  </option>
                </datalist>
                <br><br>
                <button type="submit">Submit</button>

            </form>
        </section>
    </main>
    <footer></footer>
</body>
</html>
