<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h2>Order List</h2>

    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>
    
    <h2>UnOrder List</h2>

    <ul>
        <li>VS Code </li>
        <li>Git</li>
        <li>Sql Server</li>
    </ul>

    <h2>Describtion List</h2>
    <dl>
        <dt>HTML</dt>
        <dd>هو لغة ترميز هيكلة المواقع</dd>
         <dt>CSS</dt>
        <dd>هو لغة تنثيق المواقع</dd>
    </dl>

    
</body>
</html>
